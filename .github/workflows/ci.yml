name: Python CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:

    runs-on: tenki-standard-medium-4c-8g

    steps:

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest